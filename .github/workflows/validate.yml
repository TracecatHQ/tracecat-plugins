name: Validate plugins

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install check-jsonschema==0.35.0 ruff==0.12.10

      - name: Lint Python
        run: ruff check .

      - name: Test upload helper
        run: python -m unittest discover -s tests -v

      - name: Check cross-client invariants
        run: python scripts/validate_manifests.py

      - name: Validate Agent Plugins manifest
        run: >-
          check-jsonschema
          --schemafile https://agent-plugins.org/schemas/1.0.0/plugin.schema.json
          plugins/tracecat/plugin.json

      - name: Validate Agent Plugins MCP config
        run: >-
          check-jsonschema
          --schemafile https://agent-plugins.org/schemas/1.0.0/mcp.schema.json
          plugins/tracecat/mcp.json
